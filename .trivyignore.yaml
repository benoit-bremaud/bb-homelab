# Accepted Critical findings on the service images (issue #201).
#
# Scope: images pinned in services/*/docker-compose.yml, scanned with
#   trivy image --platform linux/arm64 --scanners vuln --severity CRITICAL \
#     --ignore-unfixed --ignorefile .trivyignore.yaml <image>
# Each entry is scoped to the exact package version (purl), so an image bump
# that changes the package drops the waiver and forces a fresh triage.
# Remove an entry as soon as the fixed image ships.

vulnerabilities:
  # --- Jellyfin 10.11.11 (10.11 branch frozen since 2026-06-06) ----------
  - id: CVE-2026-70188
    purls:
      - "pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-arm64@9.0.16"
    statement: >-
      Reachable: ASP.NET Core serves the Jellyfin web API. Exposure limited to
      127.0.0.1 and the tailnet behind Caddy (#139). No 10.11 image will ship
      runtime 9.0.21; the fix is the 12.x migration (#142).
    expired_at: 2027-01-04
  - id: CVE-2026-88092
    purls:
      - "pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-arm64@9.0.16"
    statement: >-
      Reachable: same runtime and exposure as CVE-2026-70188. Fix is the 12.x
      migration (#142).
    expired_at: 2027-01-04
  - id: CVE-2026-13221
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: Jellyfin never runs Perl; perl-base is a Debian base
      package only used by maintainer scripts at build time.
    expired_at: 2027-02-03
  - id: CVE-2026-42496
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: Archive::Tar is never invoked at runtime; no Perl process
      runs in the container.
    expired_at: 2027-02-03
  - id: CVE-2026-8376
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: affects 32-bit builds only (image is arm64) and no Perl
      process runs in the container.
    expired_at: 2027-02-03
  - id: CVE-2026-111497
    purls:
      - "pkg:deb/debian/libbrotli1@1.1.0-2%2Bb7?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: the Jellyfin server does not decode brotli from untrusted
      sources; brotli decoding happens in the client browser.
    expired_at: 2027-02-03

  # --- Uptime Kuma 2.5.9-slim (Debian 12 base, no Chromium) -------------
  - id: CVE-2024-24790
    purls:
      - "pkg:golang/stdlib@v1.20.5"
    statement: >-
      Not reachable: Go stdlib of the bundled extra/healthcheck binary, which
      only probes the local Kuma HTTP port for the Docker healthcheck.
    expired_at: 2027-02-03
  - id: CVE-2025-68121
    purls:
      - "pkg:golang/stdlib@v1.20.5"
    statement: >-
      Not reachable: TLS session resumption in the local healthcheck binary,
      which speaks plain HTTP to localhost.
    expired_at: 2027-02-03
  - id: CVE-2026-41242
    purls:
      - "pkg:npm/protobufjs@7.2.6"
    statement: >-
      Not reachable: exploitation needs an attacker-controlled protobuf
      definition; Kuma only loads its own bundled definitions.
    expired_at: 2027-02-03
  - id: CVE-2026-59873
    purls:
      - "pkg:npm/tar@6.2.1"
    statement: >-
      Low risk: denial of service on a crafted gzip archive; only an
      authenticated admin can feed archives to Kuma (tailnet-only UI).
    expired_at: 2027-02-03
  - id: CVE-2026-111497
    purls:
      - "pkg:deb/debian/libbrotli1@1.0.9-2%2Bb6?arch=arm64&distro=debian-12.15"
    statement: >-
      Not reachable: Kuma runs on Node.js with its own bundled brotli; the
      Debian libbrotli1 is unused by the monitors (no Chromium in -slim).
    expired_at: 2027-02-03

  # --- n8n 2.47.2 (Alpine 3.24) -------------------------------------------
  - id: CVE-2026-111497
    purls:
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1?arch=aarch64&distro=3.24"
    statement: >-
      Possibly reachable: the Alpine nodejs package links the system brotli,
      so HTTP Request nodes decoding br responses use it. Workflows only call
      known API hosts. Short expiry: weekly n8n releases should rebuild on
      brotli-libs 1.2.1-r0.
    expired_at: 2026-12-05
