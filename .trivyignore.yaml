# Accepted Critical findings on the service images (issue #201).
#
# Scope: images pinned in services/*/docker-compose.yml, scanned with
#   trivy image --platform linux/arm64 --scanners vuln --severity CRITICAL \
#     --ignore-unfixed --exit-code 1 --ignorefile .trivyignore.yaml <image>
# Last triage: Trivy 0.76.1, vulnerability DB of 2026-11-05.
# Each entry is scoped to the exact package version (purl), so an image bump
# that changes the package drops the waiver and forces a fresh triage.
# Review every entry before its expiry (#219); remove it as soon as the
# fixed image ships.

vulnerabilities:
  # --- Jellyfin 10.11.11 (10.11 branch frozen since 2026-06-06) ----------
  - id: CVE-2026-70188
    purls:
      - "pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-arm64@9.0.16"
    statement: >-
      Reachable: ASP.NET Core serves the Jellyfin web API, exposed on
      127.0.0.1, directly on the tailnet IP :8096 and through Caddy; request
      smuggling can bypass Caddy's filters. The tailnet holds owner devices
      only. No 10.11 image will ship runtime 9.0.21; the fix is the 12.x
      migration (#142). Follow-up: #219.
    expired_at: 2027-01-04
  - id: CVE-2026-88092
    purls:
      - "pkg:nuget/Microsoft.AspNetCore.App.Runtime.linux-arm64@9.0.16"
    statement: >-
      Reachable: same runtime and exposure as CVE-2026-70188. Fix is the 12.x
      migration (#142). Follow-up: #219.
    expired_at: 2027-01-04
  - id: CVE-2026-13221
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: Jellyfin never runs Perl; perl-base is a Debian base
      package used by maintainer scripts at build time. Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2026-42496
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: Archive::Tar is never invoked at runtime; no Perl process
      runs in the container. Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2026-8376
    purls:
      - "pkg:deb/debian/perl-base@5.40.1-6?arch=arm64&distro=debian-13.5"
    statement: >-
      Not reachable: affects 32-bit builds only (image is arm64) and no Perl
      process runs in the container. Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2026-111497
    purls:
      - "pkg:deb/debian/libbrotli1@1.1.0-2%2Bb7?arch=arm64&distro=debian-13.5"
    statement: >-
      Low risk: loaded through libfreetype6 (fonts in media, via
      libbluray/fontconfig in jellyfin-ffmpeg) and libcurl; the media library
      is owner-controlled. Follow-up: #219.
    expired_at: 2027-02-03

  # --- Uptime Kuma 2.5.9-slim (Debian 12 base, no Chromium) -------------
  - id: CVE-2024-24790
    purls:
      - "pkg:golang/stdlib@v1.20.5"
    statement: >-
      Not reachable: Go stdlib of the bundled extra/healthcheck binary, which
      only probes the local Kuma HTTP port for the Docker healthcheck.
      Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2025-68121
    purls:
      - "pkg:golang/stdlib@v1.20.5"
    statement: >-
      Not reachable: TLS session resumption in the local healthcheck binary,
      which speaks plain HTTP to localhost. Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2026-41242
    purls:
      - "pkg:npm/protobufjs@7.2.6"
    statement: >-
      Reachable by an authenticated Kuma admin: a gRPC Keyword monitor parses
      its user-supplied proto definition (code execution in the container).
      Accepted: the UI is tailnet-only with a single admin, and no gRPC
      monitor is configured (checked 2026-11-05). Follow-up: #219.
    expired_at: 2027-01-04
  - id: CVE-2026-59873
    purls:
      - "pkg:npm/tar@6.2.1"
    statement: >-
      Not reachable: node-tar is only required by extra/download-dist.js, a
      build-time script; Kuma never extracts archives at runtime.
      Follow-up: #219.
    expired_at: 2027-02-03
  - id: CVE-2026-111497
    purls:
      - "pkg:deb/debian/libbrotli1@1.0.9-2%2Bb6?arch=arm64&distro=debian-12.15"
    statement: >-
      Not reachable: its consumer is libcurl4/curl, which Kuma does not run;
      Node is the upstream build with its own bundled brotli.
      Follow-up: #219.
    expired_at: 2027-02-03

  # --- n8n 2.47.2 (Alpine 3.24) -------------------------------------------
  - id: CVE-2026-111497
    purls:
      - "pkg:apk/alpine/brotli-libs@1.2.0-r1?arch=aarch64&distro=3.24"
    statement: >-
      Possibly reachable: Node bundles its own brotli, but libcurl (used by
      git, so a Git node pointed at a hostile server) and freetype (used by
      graphicsmagick) load the system library. Workflows only call known
      hosts. Short expiry: weekly n8n releases should rebuild on
      brotli-libs 1.2.1-r0. Follow-up: #219.
    expired_at: 2026-12-05
