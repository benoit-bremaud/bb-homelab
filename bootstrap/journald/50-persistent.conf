# Managed by bb-homelab (bootstrap/journald/50-persistent.conf, issue #169).
# Install to /etc/systemd/journald.conf.d/50-persistent.conf.
#
# Raspberry Pi OS ships 40-rpi-volatile-storage.conf with Storage=volatile,
# so every boot wipes the kernel log. This drop-in sorts after it and keeps
# the journal on the SD card, capped at 100 MB. All log levels are kept on
# purpose: USB/UAS reset messages are logged at info level.
[Journal]
Storage=persistent
SystemMaxUse=100M
