# Managed by bb-homelab (bootstrap/docker/containerd-appdata-mount.conf, issues #202, #213).
# Install to /etc/systemd/system/containerd.service.d/appdata-mount.conf.
#
# containerd storage lives on the data HDD (ADR 0008): do not start containerd
# before /mnt/appdata is mounted, or it would create a fresh empty store.
[Unit]
RequiresMountsFor=/mnt/appdata
