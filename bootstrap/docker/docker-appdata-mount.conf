# Managed by bb-homelab (bootstrap/docker/docker-appdata-mount.conf, issues #202, #213).
# Install to /etc/systemd/system/docker.service.d/appdata-mount.conf.
#
# Docker storage lives on the data HDD (ADR 0008): do not start Docker
# before /mnt/appdata is mounted, or it would create a fresh empty store.
[Unit]
RequiresMountsFor=/mnt/appdata
