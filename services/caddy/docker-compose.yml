services:
  caddy:
    # Pinned by default. Bump via CADDY_IMAGE_TAG in .env when a newer
    # release is needed. :latest avoided so a background pull cannot
    # drag in a breaking change.
    image: caddy:${CADDY_IMAGE_TAG:-2.11.7}
    container_name: bb-homelab-caddy
    restart: unless-stopped
    # Bound to loopback and the Pi's tailnet IP only (ADR 0007, #139):
    # Docker-published ports bypass UFW, so an unbound port is open to the
    # whole LAN. Loopback keeps the Pi's own Kuma pushes working
    # (127.0.0.1 status.bb-homelab.local in /etc/hosts, #161). Binding the
    # tailnet IP at boot, before tailscaled is up, needs
    # net.ipv4.ip_nonlocal_bind=1 (bootstrap/sysctl/).
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp"  # HTTP/3 (QUIC)
      - "100.121.134.61:80:80"
      - "100.121.134.61:443:443"
      - "100.121.134.61:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Host bind-mounts on the HDD (Pattern Y, like n8n — issue #96).
      # /data holds the internal CA root + issued certs: losing it forces
      # every client device to re-trust, so it belongs on the durable HDD,
      # not the SD card. create_host_path: false is a fail-fast guard —
      # the HDD uses `nofail` in fstab, so a failed mount would otherwise
      # let Docker auto-create the source on the root filesystem and Caddy
      # would silently regenerate a brand-new CA. Refusing to create the
      # path makes the container fail to start instead.
      - type: bind
        source: /mnt/appdata/caddy/data
        target: /data            # certificates, ACME account, internal CA
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/appdata/caddy/config
        target: /config          # auto-managed runtime config
        bind:
          create_host_path: false
    networks:
      # `edge` carries Caddy's default route and published ports, so no
      # backend sits on its gateway path (ADR 0009, #200). Each backend has
      # its own proxy network shared with Caddy only.
      edge:
        gw_priority: 1
      proxy-vaultwarden: {}
      proxy-n8n: {}
      proxy-jellyfin: {}
      proxy-homepage: {}
      proxy-uptime-kuma:
        # Kuma probes the other backends through Caddy over HTTPS. Docker
        # aliases are literal names (no wildcard): keep this list in sync
        # with the site names in the Caddyfile.
        aliases:
          - n8n.bb-homelab.local
          - jellyfin.bb-homelab.local
          - status.bb-homelab.local
          - vaultwarden.bb-homelab.local
          - home.bb-homelab.local
    # Caddy is the frontal reverse proxy (80/443) for the whole homelab, so
    # it gets a liveness probe like every backend. It hits the plain-HTTP
    # /healthz route defined in the Caddyfile (a localhost-only site), proving
    # the port-80 data plane is serving — more representative than pinging the
    # admin API. wget ships in the Alpine/busybox caddy image (as for n8n).
    # No depends_on to the backends: separate compose projects joined by
    # external networks, and depends_on does not cross them.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  # Caddy's own bridge, joined by no backend (ADR 0009).
  edge:
    driver: bridge
  # One external network per backend, shared with that backend only.
  # Each must be created once by hand on the host before Caddy starts:
  #   for s in vaultwarden n8n jellyfin uptime-kuma homepage; do
  #     docker network create "bb-homelab-proxy-$s"; done
  # External-first design so Caddy and each backend can be torn down /
  # upgraded independently without losing the bridge (ADR 0002).
  proxy-vaultwarden:
    name: bb-homelab-proxy-vaultwarden
    external: true
  proxy-n8n:
    name: bb-homelab-proxy-n8n
    external: true
  proxy-jellyfin:
    name: bb-homelab-proxy-jellyfin
    external: true
  proxy-uptime-kuma:
    name: bb-homelab-proxy-uptime-kuma
    external: true
  proxy-homepage:
    name: bb-homelab-proxy-homepage
    external: true
