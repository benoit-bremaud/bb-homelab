services:
  uptime-kuma:
    # Pinned by default. Bump via UPTIME_KUMA_IMAGE_TAG in .env after
    # testing. :latest avoided so a background pull cannot drag in a
    # breaking change.
    image: louislam/uptime-kuma:${UPTIME_KUMA_IMAGE_TAG:-2.5.7}
    container_name: bb-homelab-uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Paris}
      # Probes reach the other backends through Caddy over HTTPS (ADR 0009),
      # so Node must trust Caddy's internal root CA.
      - NODE_EXTRA_CA_CERTS=/etc/caddy-root.crt
    volumes:
      # Host bind-mount on the HDD (Pattern Y, role appdata). Single
      # volume → the service dir is mounted directly. create_host_path:
      # false makes Docker refuse to start if the source is absent (the
      # common HDD-not-mounted case); the real invariant is
      # `mountpoint -q /mnt/appdata`. Create the dir first: see
      # storage/LAYOUT.md.
      - type: bind
        source: /mnt/appdata/uptime-kuma
        target: /app/data
        bind:
          create_host_path: false
      # Only the public root certificate, read-only. Never mount the PKI
      # directory: it also holds the CA private keys. Restart Kuma if the
      # internal CA is ever regenerated.
      - type: bind
        source: /mnt/appdata/caddy/data/caddy/pki/authorities/local/root.crt
        target: /etc/caddy-root.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      # `proxy` is the dedicated external network on which Caddy reaches
      # this service via DNS name `uptime-kuma:3001` (see services/caddy/ + ADR 0009).
      - default
      - proxy
    healthcheck:
      # Built-in healthcheck shipped in the image.
      test: ["CMD", "extra/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  default:
    driver: bridge
  proxy:
    # This service's own proxy network, shared with Caddy only (ADR 0009,
    # #200): no other backend can reach it. Created once on the host with
    # `docker network create bb-homelab-proxy-uptime-kuma`.
    name: bb-homelab-proxy-uptime-kuma
    external: true
