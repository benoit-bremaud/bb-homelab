# Local SonarQube (shared instance on the dev machine). Not reachable from
# CI runners: the quality gate is a local step of the pre-merge gate.
# Scan: SONAR_TOKEN=<global analysis token> sonar-scanner -Dsonar.qualitygate.wait=true
sonar.projectKey=bb-homelab
sonar.projectName=bb-homelab
sonar.host.url=http://localhost:9000

sonar.sources=.
sonar.exclusions=**/*.md
